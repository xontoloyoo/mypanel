<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .code { font-size: 72px; font-weight: 800; color: #f59e0b; line-height: 1; margin-bottom: 12px; }
        .title { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
        .desc { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .divider { height: 1px; background: #334155; margin: 20px 0; }
        .footer { font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">50X</div>
        <div class="title">Service Temporarily Unavailable</div>
        <div class="desc">The server encountered an internal error or gateway misconfiguration and was unable to complete your request.</div>
        <div class="divider"></div>
        <div class="footer">Secure Web Gateway</div>
    </div>
</body>
</html>
